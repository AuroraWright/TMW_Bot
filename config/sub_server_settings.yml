# Members of a sub-server must also be members of this server.
main_guild_id: 617136488840429598

# Add one or more sub-server IDs here.
sub_guild_ids:
  - 1545132788997427260
  - 1545162007354024040

# Optional access requirements, keyed by sub-server ID. A member must have at
# least one listed role in the main guild before they can remain in that
# sub-server. Sub-servers without an entry only require main-guild membership.
required_role_ids:
  1545162007354024040:
    - 1301694741083328565 # Sharing

# These sub-server roles bypass kicks for unmet membership/required-role checks.
# Main-server ban enforcement still applies.
exempt_role_ids:
  1545162007354024040:
    - 1545393232442163310

# These user IDs bypass kicks for unmet membership/required-role checks.
# Main-server ban enforcement still applies to listed users.
exempt_user_ids:
  1545162007354024040:
    - 1539607227873361971

# Structural mirroring can be limited to a subset of access-controlled
# sub-servers. The new message-achievement server is intentionally access-only.
mirrored_sub_guild_ids:
  - 1545132788997427260

# Everything in this section is applied one-way: main guild -> sub-server.
mirror:
  enabled: true
  reconcile_interval_minutes: 30
  event_debounce_seconds: 10
  mutation_delay_seconds: 0.5
  emoji_create_delay_seconds: 5
  # Emoji endpoints have unusually strict hidden per-guild limits. Keep each
  # pass small; the 30-minute reconciliation resumes whatever remains.
  emoji_creations_per_reconcile: 5
  delete_unmapped_roles: true
  delete_unmapped_channels: true
  delete_unmapped_emojis: true
  mirror_guild_settings: true
  # Keep each backup server's locally chosen name.
  mirror_guild_name: false
  mirror_member_roles: true
